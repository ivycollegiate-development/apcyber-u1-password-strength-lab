name: grade

on: [push, workflow_dispatch]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Hash file integrity
        run: python3 crack.py --selftest

      - name: README results table complete
        run: python3 check_readme.py
